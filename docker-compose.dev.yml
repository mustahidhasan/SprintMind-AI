services:
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    env_file:
      - frontend/.env.dev
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    env_file:
      - backend/.env.dev
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - ai

  ai:
    build:
      context: .
      dockerfile: docker/Dockerfile.ai
    env_file:
      - ai/.env.dev
    ports:
      - "8777:8777"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sprintmind_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
